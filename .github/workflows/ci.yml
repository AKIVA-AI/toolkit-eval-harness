name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - run: pip install -e ".[dev]"
    - run: pytest --cov=src --cov-report=xml --cov-fail-under=80 -v
    - uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    # Upgrade the runner's preinstalled pip/setuptools so pip-audit reports on
    # this project's dependencies, not on stale tooling in the hosted image.
    - run: python -m pip install --upgrade pip setuptools
    - run: pip install bandit pip-audit
    - run: pip install -e ".[signing,inspect,jsonschema,judge]"
    - run: bandit -r src/
    - name: Audit dependencies, every optional extra included
      run: pip-audit --skip-editable

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: ruff check .
    - run: pyright src/

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: pip install cyclonedx-bom
    - run: cyclonedx-py environment -o sbom.json --of json
    - uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.json

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build "twine>=6.1"
        python -m build
    - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
      run: twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/toolkit-eval" --help > /dev/null
