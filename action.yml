name: Eval regression gate
description: >-
  Compare a candidate eval report with a baseline (paired bootstrap CI, flips, per-tag
  breakdown, same-suite check), write a signed-ready report envelope, and post a summary.
author: AKIVA AI, LLC
branding:
  icon: check-circle
  color: blue

inputs:
  baseline:
    description: Baseline report (envelope or pre-1.0 JSON, from run or import).
    required: true
  candidate:
    description: Candidate report (envelope or pre-1.0 JSON, from run or import).
    required: true
  max-score-regression-pct:
    description: Fail when the upper confidence bound of the regression exceeds this percent.
    required: false
    default: "2"
  confidence:
    description: Confidence level of the bootstrap interval.
    required: false
    default: "0.95"
  iterations:
    description: Bootstrap resamples.
    required: false
    default: "10000"
  seed:
    description: Bootstrap RNG seed.
    required: false
    default: "0"
  max-new-failures:
    description: Also fail when more than this many cases flip from pass to fail (empty = not gated).
    required: false
    default: ""
  method:
    description: "bootstrap (default) or mean (pre-1.0 aggregate-mean check)."
    required: false
    default: bootstrap
  allow-suite-mismatch:
    description: Compare reports from different suites, pairing common case ids ("true"/"false").
    required: false
    default: "false"
  out:
    description: Path for the eval.compare report envelope.
    required: false
    default: eval-compare.json
  python-version:
    description: Python version used to run the harness.
    required: false
    default: "3.12"
  install:
    description: >-
      pip requirement to install the harness from. Default: this action's own checkout, so the
      harness version always matches the action ref you pinned.
    required: false
    default: ""
  comment-on-pr:
    description: Post (or update) the summary as a pull request comment ("true"/"false").
    required: false
    default: "false"
  github-token:
    description: >-
      Token for the PR comment (needs pull-requests: write). Only used when comment-on-pr is
      "true".
    required: false
    default: ""
  fail-on-regression:
    description: Fail the step when the gate fails ("true"/"false").
    required: false
    default: "true"

outputs:
  verdict:
    description: pass, fail or error (from the report envelope).
    value: ${{ steps.compare.outputs.verdict }}
  exit-code:
    description: toolkit-eval compare exit code (0 pass, 1 regression, 2 input error, 4 suite mismatch).
    value: ${{ steps.compare.outputs.exit-code }}
  report:
    description: Path of the eval.compare report envelope.
    value: ${{ inputs.out }}
  summary:
    description: Path of the Markdown summary.
    value: ${{ steps.compare.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install toolkit-eval-harness
      shell: bash
      env:
        INSTALL_SPEC: ${{ inputs.install }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --disable-pip-version-check -q "${INSTALL_SPEC:-$ACTION_PATH}"
        toolkit-eval --version

    - name: Compare reports
      id: compare
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        MAX_PCT: ${{ inputs.max-score-regression-pct }}
        CONFIDENCE: ${{ inputs.confidence }}
        ITERATIONS: ${{ inputs.iterations }}
        SEED: ${{ inputs.seed }}
        MAX_NEW: ${{ inputs.max-new-failures }}
        METHOD: ${{ inputs.method }}
        ALLOW_MISMATCH: ${{ inputs.allow-suite-mismatch }}
        OUT: ${{ inputs.out }}
      run: |
        summary="${RUNNER_TEMP}/eval-compare-summary.md"
        args=(compare --baseline "$BASELINE" --candidate "$CANDIDATE"
              --max-score-regression-pct "$MAX_PCT" --confidence "$CONFIDENCE"
              --iterations "$ITERATIONS" --seed "$SEED" --method "$METHOD" --out "$OUT")
        if [ -n "$MAX_NEW" ]; then args+=(--max-new-failures "$MAX_NEW"); fi
        if [ "$ALLOW_MISMATCH" = "true" ]; then args+=(--allow-suite-mismatch); fi
        set +e
        toolkit-eval --format markdown --output "$summary" "${args[@]}"
        code=$?
        set -e
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '### :x: Eval gate error\n\n`toolkit-eval compare` exited %s; see the step log.\n' \
            "$code" | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi
        verdict=error
        if [ -f "$OUT" ]; then
          verdict=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["predicate"]["verdict"])' "$OUT")
        fi
        {
          echo "exit-code=$code"
          echo "verdict=$verdict"
          echo "summary=$summary"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: inputs.comment-on-pr == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY: ${{ steps.compare.outputs.summary }}
        REPO: ${{ github.repository }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning::comment-on-pr is true but no github-token was given; skipping comment"
          exit 0
        fi
        body="${RUNNER_TEMP}/eval-compare-comment.md"
        { echo '<!-- toolkit-eval-harness:compare -->'; cat "$SUMMARY"; } > "$body"
        gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body" --edit-last \
          || gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"

    - name: Apply gate
      if: inputs.fail-on-regression == 'true' && steps.compare.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.compare.outputs.exit-code }}
        VERDICT: ${{ steps.compare.outputs.verdict }}
      run: |
        echo "::error::Eval gate verdict: $VERDICT (toolkit-eval compare exit code $CODE)"
        exit "$CODE"
