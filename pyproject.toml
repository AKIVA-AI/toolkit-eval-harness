[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-eval-harness"
version = "1.0.0"
description = "Eval regression gate with signed evidence: paired-bootstrap compare, importers for promptfoo, Inspect AI and DeepEval, in-toto report envelopes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["eval", "llm", "testing", "regression", "ci", "bootstrap", "in-toto", "promptfoo", "inspect-ai", "deepeval"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-eval-harness"
Documentation = "https://github.com/AKIVA-AI/toolkit-eval-harness#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-eval-harness"
Issues = "https://github.com/AKIVA-AI/toolkit-eval-harness/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-eval-harness/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-eval = "toolkit_eval_harness.cli:main"

[project.optional-dependencies]
signing = [
  "cryptography>=43.0.0",
]
inspect = [
  "zstandard>=0.22",
]
jsonschema = [
  "jsonschema>=4.18",
]
judge = [
  "litellm>=1.50",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "cryptography>=43.0.0",
  "jsonschema>=4.18",
  "zstandard>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_eval_harness"]
omit = ["*/toolkit_eval_harness/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_eval_harness"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_eval_harness = ["py.typed"]
